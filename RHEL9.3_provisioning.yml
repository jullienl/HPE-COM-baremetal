#--------------------------------------Build ISO image with customized kickstart --------------------------------------------------------------------------------------

  # - set_fact:
  #      boot_drive_bytes_size: "599584145408"
  #      Controller_type: "SR/MR controller"

  # - set_fact:
  #      boot_drive_bytes_size: "480036519936"
  #      Controller_type: "NS204i"
       

  - name: Check if RHEL Custom ISO file '{{ src_iso_file }}' exists in '{{ src_iso_directory }}' on '{{lookup("pipe","hostname")}}' 
    stat:
      path: "{{ src_iso_directory }}/{{ src_iso_file }}"
    register: ISO_Present
    delegate_to: localhost

  - name: Create the directory '{{ src_iso_directory }}' to host the ISO file on '{{ lookup("pipe","hostname") }}'
    file:
      path: "{{ src_iso_directory }}"
      state: directory
    when: ISO_Present.stat.exists == False
    delegate_to: localhost

  - name: Check if RHEL ISO '{{ src_iso_url }}/{{ src_iso_file }}' exists  
    uri:
      url: "{{ src_iso_url }}/{{ src_iso_file }}"
      method: HEAD
      status_code: 200 # The HTTP status code for a successful request.
      validate_certs: false
    when: ISO_Present.stat.exists == False
    delegate_to: localhost

  - name: Download file '{{ src_iso_file }}' to '{{ lookup("pipe","hostname") }}' in '{{ src_iso_directory }}' if not present
    get_url:
      url: "{{ src_iso_url }}/{{ src_iso_file }}"
      dest: "{{ src_iso_directory }}"
      validate_certs: no
    when: ISO_Present.stat.exists == False
    delegate_to: localhost

  - name: Collect ISO label (can be required for some booltloader modifications)
    shell: isoinfo -i {{ src_iso_directory }}/{{ src_iso_file }} -d  | grep "Volume id" | awk '{ print substr ($0, 12 ) }'
    register: iso_info
    delegate_to: localhost

  - set_fact: iso_label={{ iso_info.stdout }}

  # - debug: msg='{{ iso_label }}'

  - name: Create '/mnt/{{ inventory_hostname }}' on '{{lookup("pipe","hostname")}}'
    become: yes
    file:
      path: /mnt/{{ inventory_hostname }}
      state: directory
      mode: "0755"
    delegate_to: localhost

  - name: Create '{{ staging_directory }}/baremetal/{{ inventory_hostname }}/' on '{{lookup("pipe","hostname")}}' if it does not exist
    file:
      path: "{{ staging_directory }}/baremetal/{{ inventory_hostname }}"
      state: directory
    delegate_to: localhost

  - name: Mount RHEL ISO '{{ src_iso_directory }}/{{ src_iso_file }}' to '/mnt/{{ inventory_hostname }}/' 
    become: yes
    shell: 
      mount -o loop -t iso9660 --read-only {{ src_iso_directory }}/{{ src_iso_file }} /mnt/{{ inventory_hostname }}/
    delegate_to: localhost

  - name: Copy ISO files to '{{ staging_directory }}/baremetal/{{ inventory_hostname }}/' on '{{lookup("pipe","hostname")}}'
    become: yes
    shell: |
      rsync -a /mnt/{{ inventory_hostname }}/. {{ staging_directory }}/baremetal/{{ inventory_hostname }}/
    delegate_to: localhost

  - name: Set permissions to allow the user running the Ansible playbook to delete the folder '{{ staging_directory }}/baremetal/{{ inventory_hostname }}'
    become: yes
    file:
      path: "{{ staging_directory }}/baremetal/{{ inventory_hostname }}"
      mode: ug+w
      owner: "{{ user }}"
      group: "{{ user }}"
      recurse: yes
      state: directory
    delegate_to: localhost

  - name: Unmount directory '/mnt/{{ inventory_hostname }}'
    become: yes
    shell: 
      umount /mnt/{{ inventory_hostname }}
    delegate_to: localhost

  - name: Create '/usr/share/nginx/html/isos/' if it does not exist
    become: yes
    file:
      path: /usr/share/nginx/html/isos/
      state: directory
      mode: "0755"
    delegate_to: localhost

  # ---- Shared prepared boot ISO (built once, reused by all hosts) ----
  # The RHEL boot ISO is customized once: a fast GRUB timeout plus the host-agnostic HPE AMS rpm
  # baked into '/rpms' (still reachable at /run/install/repo/rpms by the kickstart). The per-host
  # kickstart is delivered on a small separate seed ISO labelled OEMDRV, which Anaconda auto-discovers.
  # This avoids a full multi-GB ISO rebuild and copy per host.

  - name: Check if the shared prepared RHEL boot ISO '{{ prepared_iso_file }}' already exists on nginx
    stat:
      path: "/usr/share/nginx/html/isos/{{ prepared_iso_file }}"
    register: prepared_iso_present
    run_once: true
    delegate_to: localhost

  - name: Build the shared prepared RHEL boot ISO (done once for all hosts)
    when: not prepared_iso_present.stat.exists
    run_once: true
    delegate_to: localhost
    block:

      - name: Create '/mnt/_prepared_iso_rhel' if it does not exist
        become: yes
        file:
          path: /mnt/_prepared_iso_rhel
          state: directory
          mode: "0755"

      - name: Create the staging directory for the prepared boot ISO
        file:
          path: "{{ staging_directory }}/baremetal/_prepared_iso"
          state: directory

      - name: Mount the source RHEL ISO '{{ src_iso_directory }}/{{ src_iso_file }}'
        become: yes
        shell: mount -o loop -t iso9660 --read-only {{ src_iso_directory }}/{{ src_iso_file }} /mnt/_prepared_iso_rhel/

      - name: Copy the ISO files to the prepared staging directory
        become: yes
        shell: |
          rsync -a /mnt/_prepared_iso_rhel/. {{ staging_directory }}/baremetal/_prepared_iso/

      - name: Set permissions so the Ansible user can modify the prepared staging directory
        become: yes
        file:
          path: "{{ staging_directory }}/baremetal/_prepared_iso"
          mode: ug+w
          owner: "{{ user }}"
          group: "{{ user }}"
          recurse: yes
          state: directory

      - name: Unmount '/mnt/_prepared_iso_rhel'
        become: yes
        shell: umount /mnt/_prepared_iso_rhel

      - name: Set a fast boot timeout, disable ISO media verification, and disable systemd GPT auto-root (UEFI GRUB + BIOS isolinux)
        # RHEL boot media default to the "Test this media & install" entry, which adds the
        # 'rd.live.check' kernel arg. That makes Anaconda run checkisomd5 over the WHOLE ISO before
        # installing - very slow here because the ISO is served as iLO virtual media over HTTP (nginx).
        # We boot the plain "Install" entry, strip 'rd.live.check' everywhere, and shorten the timeout.
        #
        # We ALSO add 'rd.systemd.gpt_auto=0 rd.auto=0' to the installer kernel line. The installer initramfs
        # has no explicit 'root=', so systemd-gpt-auto-generator tries to auto-discover a root partition from
        # any leftover GPT on the disks. On a REPROVISIONED server whose boot disk still carries a previous
        # install (e.g. an NS204i NVMe with an old Ubuntu/HVM GPT+LVM), it latches onto that stale layout,
        # waits for '/dev/gpt-auto-root', TIMES OUT, and drops the installer to dracut Emergency Mode BEFORE
        # Anaconda (and therefore the kickstart 'clearpart' that would wipe the disk) ever runs. Disabling
        # GPT auto-root makes the installer ignore leftover partitions and boot straight into Anaconda, which
        # then clears and repartitions the target disk as designed. No-op on a clean/first-time server.
        #
        # Both boot paths must be handled: UEFI reads EFI/BOOT/grub.cfg, Legacy BIOS reads isolinux/isolinux.cfg.
        # NOTE: on UEFI virtual-media boot the firmware actually loads GRUB from the El Torito image
        # images/efiboot.img, which embeds its OWN copy of EFI/BOOT/grub.cfg. Editing the ISO9660
        # EFI/BOOT/grub.cfg below is NOT enough - the embedded copy is patched in the next task.
        shell: |
          GPT_OFF='rd.systemd.gpt_auto=0 rd.auto=0'
          # --- UEFI (GRUB) ---
          sed -i 's/^set default=.*/set default="0"/' {{ staging_directory }}/baremetal/_prepared_iso/EFI/BOOT/grub.cfg
          sed -i 's/^set timeout=.*/set timeout=5/'    {{ staging_directory }}/baremetal/_prepared_iso/EFI/BOOT/grub.cfg
          sed -i 's/ rd.live.check//g'                 {{ staging_directory }}/baremetal/_prepared_iso/EFI/BOOT/grub.cfg
          # Append the GPT-auto-off args to every kernel line (linux/linuxefi) if not already present.
          sed -i "/^\s*linux\(efi\)\?\s/{/rd.systemd.gpt_auto/!s/\$/ ${GPT_OFF}/}" {{ staging_directory }}/baremetal/_prepared_iso/EFI/BOOT/grub.cfg
          # --- Legacy BIOS (isolinux) ---
          # RHEL isolinux defaults to the media-check entry ('menu default' on 'label check'); strip the
          # check and shorten the timeout (isolinux timeout is in 1/10 s, so 50 = 5 s).
          sed -i 's/ rd.live.check//g'  {{ staging_directory }}/baremetal/_prepared_iso/isolinux/isolinux.cfg
          sed -i 's/^timeout .*/timeout 50/' {{ staging_directory }}/baremetal/_prepared_iso/isolinux/isolinux.cfg
          # Append the GPT-auto-off args to every 'append' line if not already present.
          sed -i "/^\s*append /{/rd.systemd.gpt_auto/!s/\$/ ${GPT_OFF}/}" {{ staging_directory }}/baremetal/_prepared_iso/isolinux/isolinux.cfg

      - name: Apply the same fixes inside 'images/efiboot.img' (the GRUB config UEFI virtual-media boot actually reads)
        # UEFI firmware boots GRUB from the El Torito image 'images/efiboot.img', which embeds its OWN
        # EFI/BOOT/grub.cfg. The stock embedded config defaults to entry 1 ('Test this media & install',
        # i.e. rd.live.check) and lacks the GPT-auto-off args, so editing only the ISO9660 grub.cfg above
        # has NO effect on UEFI boot: the server still runs the slow checkisomd5 media verification and can
        # still hit dracut Emergency Mode from a leftover GPT. We loop-mount the FAT image read-write and
        # apply the identical edits (default=Install, strip rd.live.check, fast timeout, disable GPT auto-root).
        become: yes
        shell: |
          GPT_OFF='rd.systemd.gpt_auto=0 rd.auto=0'
          EFIMNT=/mnt/_prepared_iso_rhel_efi
          EFIIMG={{ staging_directory }}/baremetal/_prepared_iso/images/efiboot.img
          mkdir -p ${EFIMNT}
          mount -o loop ${EFIIMG} ${EFIMNT}
          sed -i 's/^set default=.*/set default="0"/' ${EFIMNT}/EFI/BOOT/grub.cfg
          sed -i 's/^set timeout=.*/set timeout=5/'    ${EFIMNT}/EFI/BOOT/grub.cfg
          sed -i 's/ rd.live.check//g'                 ${EFIMNT}/EFI/BOOT/grub.cfg
          sed -i "/^\s*linux\(efi\)\?\s/{/rd.systemd.gpt_auto/!s/\$/ ${GPT_OFF}/}" ${EFIMNT}/EFI/BOOT/grub.cfg
          sync
          umount ${EFIMNT}

      - name: Create the '/rpms' directory in the prepared ISO staging area
        file:
          path: "{{ staging_directory }}/baremetal/_prepared_iso/rpms"
          state: directory

      - name: Bake the host-agnostic HPE AMS rpm into the prepared ISO '/rpms' (required by COM to detect OS install completion)
        copy:
          src: files/{{ rhel_version }}/{{ AMS_package }}
          dest: "{{ staging_directory }}/baremetal/_prepared_iso/rpms/{{ AMS_package }}"

      - name: Build the prepared boot ISO with mkisofs (host-agnostic, no per-host content)
        shell: >
          mkisofs
          -V {{ iso_label }}
          -J
          -R
          -l
          -v
          -b isolinux/isolinux.bin
          -c isolinux/boot.cat
          -no-emul-boot
          -boot-load-size 4
          -boot-info-table
          -eltorito-alt-boot
          -e images/efiboot.img
          -no-emul-boot
          -o {{ staging_directory }}/baremetal/{{ prepared_iso_file }}
          -graft-points
          {{ staging_directory }}/baremetal/_prepared_iso/

      - name: Make the prepared ISO USB-bootable (isohybrid + implantisomd5)
        shell: |
          isohybrid --uefi {{ staging_directory }}/baremetal/{{ prepared_iso_file }}
          implantisomd5 {{ staging_directory }}/baremetal/{{ prepared_iso_file }}

      - name: Move the prepared boot ISO to the nginx html folder. ISO URL='http://{{ lookup("pipe","hostname") }}/isos/{{ prepared_iso_file }}'
        become: yes
        shell: |
          mv {{ staging_directory }}/baremetal/{{ prepared_iso_file }} /usr/share/nginx/html/isos/

  # ---- Per-host kickstart seed ISO (small, one per host, labelled OEMDRV) ----

  - name: Create the seed staging directory '{{ staging_directory }}/baremetal/{{ inventory_hostname }}/seed'
    file:
      path: "{{ staging_directory }}/baremetal/{{ inventory_hostname }}/seed"
      state: directory
    delegate_to: localhost

  - name: Render the RHEL kickstart 'ks.cfg' seed for '{{ inventory_hostname }}' with variable substitution
    template:
      src: files/{{ rhel_version }}/{{ kickstart }}
      dest: "{{ staging_directory }}/baremetal/{{ inventory_hostname }}/seed/ks.cfg"
    delegate_to: localhost

  - name: Build the per-host OEMDRV kickstart seed ISO for '{{ inventory_hostname }}'
    shell: >
      xorriso -as mkisofs
      -output "{{ staging_directory }}/baremetal/{{ inventory_hostname }}-seed.iso"
      -volid OEMDRV -joliet -rock
      "{{ staging_directory }}/baremetal/{{ inventory_hostname }}/seed/"
    delegate_to: localhost

  - name: Move the per-host seed ISO to the nginx default html folder. ISO URL='http://{{ lookup("pipe","hostname") }}/isos/{{ inventory_hostname }}-seed.iso'
    become: yes
    shell: |
      mv {{ staging_directory }}/baremetal/{{ inventory_hostname }}-seed.iso /usr/share/nginx/html/isos/
    delegate_to: localhost

  - name: Update SELinux security contexts so that Nginx is allowed to serve content from the '/usr/share/nginx/html/isos/' directory.
    become: yes
    shell: |
      chcon -vR system_u:object_r:httpd_sys_content_t:s0 /usr/share/nginx/html/isos/
    delegate_to: localhost


#--------------------------------------Create OS image settings -------------------------------------------------------------------------------------------------------

  # OS image server setting is created or modified based on whether this particular resource is present or not

  - name: Check if the operating system image server setting 'OS_Image_RHEL9.3_for_{{ inventory_hostname }}' exists
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ settings_API_version }}/settings?filter={{ filter | urlencode }}"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    vars:
      filter: "name eq 'OS_Image_RHEL9.3_for_{{ inventory_hostname }}'"
    register: OS_image_server_setting
    delegate_to: localhost

  # - debug: var=OS_image_server_setting

  - name: Create an operating system image server setting 'OS_Image_RHEL9.3_for_{{ inventory_hostname }}' if it does not exist
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ settings_API_version }}/settings"
      method: POST
      status_code: 201
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/json"
      body_format: json
      body:
        name:  "OS_Image_RHEL9.3_for_{{ inventory_hostname }}"
        description: ""
        category:  "OS"
        settings:
          DEFAULT:
            osType: "RHEL"
            mediaUrl: 'http://{{ lookup("pipe","hostname") }}/isos/{{ prepared_iso_file }}'
            unattendedInstallationFileUrl: 'http://{{ lookup("pipe","hostname") }}/isos/{{ inventory_hostname }}-seed.iso'
    register: OS_image_server_setting_result
    delegate_to: localhost
    when: OS_image_server_setting.json.count == 0

  - name: Result of the 'OS_Image_RHEL9.3_for_{{ inventory_hostname }}' creation task
    debug: var=OS_image_server_setting_result.msg
    when: OS_image_server_setting.json.count == 0

  - name: Set variables for the id and the resourceUri of the OS Image configuration 'OS_Image_RHEL9.3_for_{{ inventory_hostname }}' just created 
    set_fact:
      OS_image_server_setting_id: "{{ OS_image_server_setting_result.json.id }}" 
      OS_image_server_setting_resourceuri: "{{ OS_image_server_setting_result.json.resourceUri }}"
    when: OS_image_server_setting.json.count == 0

  - name: Update the operating system image server setting 'OS_Image_RHEL9.3_for_{{ inventory_hostname }}' if it does not exist
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ settings_API_version }}/settings/{{ OS_image_server_setting_id }}"
      method: PATCH
      status_code: 200
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/merge-patch+json"
      body_format: json
      body:
        name:  "OS_Image_RHEL9.3_for_{{ inventory_hostname }}"
        description: ""
        settings:
          DEFAULT:
            osType: "RHEL"
            mediaUrl: 'http://{{ lookup("pipe","hostname") }}/isos/{{ prepared_iso_file }}'
            unattendedInstallationFileUrl: 'http://{{ lookup("pipe","hostname") }}/isos/{{ inventory_hostname }}-seed.iso'
    vars: 
      OS_image_server_setting_id: "{{ OS_image_server_setting  | json_query('json.items[0].id') }}"
    register: OS_image_server_setting_result
    delegate_to: localhost
    when: OS_image_server_setting.json.count == 1

  # - debug: var=OS_image_server_setting_result  

  - name: Result of the 'OS_Image_RHEL9.3_for_{{ inventory_hostname }}' update task
    debug: var=OS_image_server_setting_result.msg
    when: OS_image_server_setting.json.count == 1

  - name: Set variables for the id and the resourceUri of the OS Image configuration 'OS_Image_RHEL9.3_for_{{ inventory_hostname }}' just updated
    set_fact:
      OS_image_server_setting_id: "{{ OS_image_server_setting | json_query('json.items[0].id') }}" 
      OS_image_server_setting_resourceuri: "{{ OS_image_server_setting | json_query('json.items[0].resourceUri') }}"
    when:  OS_image_server_setting.json.count == 1

  - debug: var=OS_image_server_setting_resourceuri
  
  - debug: var=OS_image_server_setting_id


#--------------------------------------Start OS image installation-----------------------------------------------------------------------------------------------------

  # Server group modification when NS204i is found => no local storage configuration definition
  # Handle scenario where an NS204i controller is present or a local disk will be used as the RHEL installation target.

  - name: Update temporary group '{{ temporary_server_group_name }}' to add OS image installation settings with NS204i
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ groups_API_version }}/groups/{{ temporary_group_id }}"
      method: PATCH
      status_code: 200
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/merge-patch+json"
      body_format: json
      body:
        name: "{{ temporary_server_group_name }}"
        description: "Temporary server group for RHEL installation on server '{{ inventory_hostname }}'"
        settingsUris: 
          - "{{ bios_server_setting_resourceuri }}"   
          - "{{ OS_image_server_setting_resourceuri }}"
        policies:
          onDeviceAdd:
            biosApplySettings: true
            biosFactoryReset: false
            firmwarePowerOff: false
            firmwareUpdate: false
            iloApplySettings: false
            # Keep the STANDING group policy OS install disabled. The OS install is triggered ONCE, explicitly, by
            # the 'Start OS image installation' GroupOSInstallation job below. If 'true', COM re-applies the group
            # policy when the installed server reconnects (AMS) and reinstalls the OS in a loop.
            osInstall: false
            storageConfiguration: false
            storageVolumeDeletion: false
            storageVolumeName: ""
            externalStorageConfiguration: false
            osCompletionTimeoutMin: 180 # The OS completion timeout in minutes. Default: 240. Maximum: 720. Minimum: 60
          onDeviceApply:
            firmwareDowngrade: false
        # autoAddTags:       
    register: server_group_result
    when:  NS204i_data is defined or no_NS204i_no_SR_MR_but_local_disk is defined
    delegate_to: localhost

  - name: Display response of the group '{{ temporary_server_group_name }}' update request with NS204i
    debug: var=server_group_result.msg
    when:  NS204i_data is defined or no_NS204i_no_SR_MR_but_local_disk is defined

  # Server group modification when NS204i is not found => set local storage configuration definition

  - name: Update temporary group '{{ temporary_server_group_name }}' to add OS image installation settings with storage controller (without NS204i)
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ groups_API_version }}/groups/{{ temporary_group_id }}"
      method: PATCH
      status_code: 200
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/merge-patch+json"
      body_format: json
      body:
        name: "{{ temporary_server_group_name }}"
        description: "Temporary server group for RHEL installation on server '{{ inventory_hostname }}'"
        settingsUris: 
          - "{{ bios_server_setting_resourceuri }}"   
          - "{{ internal_storage_server_setting_resourceuri }}"       
          - "{{ OS_image_server_setting_resourceuri }}"
        serverPolicies:
          onServerAdd:
            firmwareUpdate: false
            biosApplySettings: true
            storageConfiguration: true
            storageVolumeDeletion: true
            storageVolumeName: "OS_boot_volume"
            # Keep the STANDING group policy OS install disabled - the OS install is triggered ONCE by the explicit
            # GroupOSInstallation job below. If 'true', COM re-applies the policy when the installed server
            # reconnects (AMS) and reinstalls the OS in a loop.
            osInstall: false
          onSettingsApply:
            firmwareDowngrade: false
        # autoAddServerTags:
    register: server_group_result
    when:  NS204i_data is undefined and SR_MR_storage_controller_data is defined
    delegate_to: localhost

  - name: Display response of the group '{{ temporary_server_group_name }}' update request with storage controller
    debug: var=server_group_result.msg
    when:  NS204i_data is undefined and SR_MR_storage_controller_data is defined

  - name: Start OS image installation in group '{{ temporary_server_group_name }}'
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ jobs_API_version }}/jobs"
      method: POST
      status_code: 201
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/json"
      body_format: json
      body:
        jobTemplate: "{{ GroupOSInstallation_job_template_id }}"
        resourceId: "{{ temporary_group_id }}"
        resourceType: "compute-ops-mgmt/group"
        jobParams: 
          devices:
            - "{{ server_id }}"
          parallel: true
          stopOnFailure: true
          osCompletionTimeoutMin: 180 # The OS completion timeout in minutes. Default: 240. Maximum: 720. Minimum: 60
    register: group_os_installation_result
    delegate_to: localhost

  - name: Display response of the OS image installation request in group '{{ temporary_server_group_name }}' 
    debug: var=group_os_installation_result.msg


#--------------------------------------Wait for OS image installation to complete -------------------------------------------------------------------------------------
  
  # Monitor server activity

  - name: Wait for the OS image installation of server '{{ serial_number }}' to complete 
    uri:
      url:  "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ activities_API_version }}/activities?filter={{ filter | urlencode  }}"  
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    vars: 
      filter: "associatedServerId eq '{{ server_id }}' and createdAt gt {{ start_time }}"      
      jq: "json.items[?name=='Server OS Installation' && contains((message || ''),'Operating system image installation task marked as complete')]"
    register: server_activities
    until: (server_activities | json_query(jq) | length) > 0 
    retries: 60
    delay: 60
    delegate_to: localhost

  # - debug: var=server_activities

  - name: Exit if operating system image installation task of server '{{ serial_number }}' failed to complete
    fail:
      msg: "The operating system image installation task of server '{{ serial_number }}' failed to complete!"
    when: server_activities.attempts >= 60


#--------------------------------------Delete temporary server group and server settings ------------------------------------------------------------------------------

  # Remove server from temporary group 

  - name: Remove server '{{ serial_number }}' from temporary group '{{ temporary_server_group_name }}' 
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ groups_API_version }}/groups/{{ temporary_group_id }}/devices/unassign"
      method: POST
      status_code: 202
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/json"
      body_format: json
      body:
        devices:
          # Only servers that are not part of a group can be assigned to a group.
          - deviceId: "{{ server_id }}"        
    register: group_unassignment_result
    delegate_to: localhost

  - name: Wait for deletion to complete
    pause:
      seconds: 15

  - name: Display response of the temporary group unassignment task
    debug: var=group_unassignment_result.msg

  # Delete temporary group

  - name: Delete temporary group '{{ temporary_server_group_name }}' 
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ groups_API_version }}/groups/{{ temporary_group_id }}"
      method: DELETE
      status_code: 204
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: server_group_deletion_result
    delegate_to: localhost

  - name: Display response of the temporary group deletion task
    debug: var=server_group_deletion_result.msg

  # Delete OS image server setting

  - name: Delete operating system image server setting 'OS_Image_RHEL9.3_for_{{ inventory_hostname }}' 
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ settings_API_version }}/settings/{{ OS_image_server_setting_id }}"
      method: DELETE
      status_code: 204
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: OS_image_server_setting_deletion_result
    delegate_to: localhost

  - name: Display response of the operating system image server setting deletion task
    debug: var=OS_image_server_setting_deletion_result.msg


#--------------------------------------Start post-installation steps --------------------------------------------------------------------------------------------------

  - name: Wait for '{{ os_ip_address }}' to respond on port 22...
    wait_for:
      timeout: 2000
      host: "{{ os_ip_address }}"
      port: 22
    delegate_to: localhost
    register: rhel_ssh_wait
    ignore_errors: true

  - name: Fail with cabling guidance if the host never came up on its management IP
    fail:
      msg:
        - "Host '{{ inventory_hostname }}' ({{ os_ip_address }}) did not respond on SSH port 22 within the timeout."
        - "The RHEL install runs over the PRIMARY NIC = the FIRST COM-inventory Ethernet port (selection is by MAC"
        - "order and is NOT carrier-aware). If only a later port on a multi-port adapter is cabled, the install can"
        - "target an un-cabled port and the host is unreachable."
        - "Fix: cable the first inventory port, OR pin the cabled port with 'bond_member_selection: mac' and"
        - "'bond_member_macs' (first MAC = cabled port) in vars/RHEL9.3_vars.yml, then re-run."
    when: rhel_ssh_wait is failed

  # The host has just been (re)installed, so its SSH host key is new. Any key left in the control node's known_hosts
  # from a previous install of the same IP/name would make ssh refuse the upcoming SSH tasks (SUT install) with
  # "REMOTE HOST IDENTIFICATION HAS CHANGED" -> auth disabled, because 'StrictHostKeyChecking=no' only auto-accepts NEW
  # keys, not CHANGED ones. Purge any stale entry first; the fresh key is then auto-added on connect.
  - name: Remove any stale SSH host key for '{{ inventory_hostname }}' from the control node known_hosts
    known_hosts:
      name: "{{ item }}"
      path: ~/.ssh/known_hosts
      state: absent
    loop:
      - "{{ os_ip_address }}"
      - "{{ inventory_fqdn }}"
      - "{{ inventory_hostname }}"
    delegate_to: localhost

  # Backup kickstart file for troubleshooting purposes

  - name: Create a kickstart backup directory if it does not exist
    file:
      path: "{{ staging_directory }}/kickstarts_backup/RHEL"
      state: directory
    delegate_to: localhost

  - name: Create a backup of the kickstart file named '{{ inventory_hostname }}_ks.cfg' in '{{ staging_directory }}/kickstarts_backup/RHEL' folder
    shell: |
      cp -f {{ staging_directory }}/baremetal/{{ inventory_hostname }}/seed/ks.cfg {{ staging_directory }}/kickstarts_backup/RHEL/{{ inventory_hostname }}_ks.cfg
    delegate_to: localhost

  # Cleaning up staging files

  - name: Delete all related files from staging location and nginx web server folder
    become: yes
    shell: |
      rm -rf {{ inventory_hostname }}
      rm -f /usr/share/nginx/html/isos/{{ inventory_hostname }}-seed.iso
      rm -rf /mnt/{{ inventory_hostname }}
    args:
      chdir: "{{ staging_directory }}/baremetal"
    delegate_to: localhost

  # Installing HPE Integrated Smart Update Tools (SUT) package on the server for online installation of HPE drivers and software

  - name: Copy HPE Integrated Smart Update Tools (SUT) package '{{ SUT_package }}' to '{{ inventory_hostname }}'
    remote_user: root
    copy:
      src: files/{{ rhel_version }}/{{ SUT_package }}
      dest: /tmp/sut.rpm
      mode: 0755

  - name: Wait for host to become reachable (faced a few times a host unreachable after the previous copy task)
    wait_for:
      host: "{{ inventory_hostname }}"
      port: 22
      state: started
      timeout: 300
    delegate_to: localhost
    
  - name: Install HPE SUT on '{{ inventory_hostname }}'
    remote_user: root
    yum:
      name: /tmp/sut.rpm
      state: present
      disable_gpg_check: yes
    register: SUT_install_result

  - name: Debug HPE SUT install result
    debug:
      var: SUT_install_result

  - name: Initiate HPE SUT service
    remote_user: root
    shell: sut -status   
    register: sut_status

  #  Rebooting the server as required after installing SUT 

  - name: Rebooting the server as required after installing SUT 
    remote_user: root
    ansible.builtin.reboot:
      msg: "Reboot initiated by Ansible to install HPE SUT"
      connect_timeout: 30  # Wait 30 seconds before attempting to connect again
      reboot_timeout: 600  # Wait up to 10 minutes for the machine to reboot
      pre_reboot_delay: 60  # Wait 60 seconds before shutting down
      post_reboot_delay: 10  # Wait 10 seconds after booting before continuing with play
      test_command: uptime  # Command to run on the system after the reboot to test if it is successful and ready

  - name: Wait for HPE SUT service to be running
    remote_user: root
    service:
      name: sut.service 
      state: started
    register: sut_service_status
    until: sut_service_status.status.ActiveState == "active"
    retries: 20
    delay: 10

  - name: Report the status of the HPE SUT service
    debug:
      msg: "HPE SUT service is {{ 'running' if sut_service_status.status.ActiveState == 'active' else 'not running' }}."

  - name: Fail if HPE SUT Service status is not running
    fail:   
      msg: "Error ! HPE SUT service is not running !"
    when: sut_service_status.status.ActiveState != "active"
    
  - name: Ensure HPE AMS service is in a running state
    remote_user: root
    service:
      name: amsd.service 
      state: started
    register: ams_service_status
    until: ams_service_status.status.ActiveState == "active"
    retries: 5
    delay: 5

  - name: Report the status of the HPE AMS service
    debug:
      msg: "HPE AMS service is {{ 'running' if ams_service_status.status.ActiveState == 'active' else 'not running' }}."

  - name: Fail if HPE AMS Service status is not running
    fail:   
      msg: "Error ! HPE AMS service is not running !"
    when: ams_service_status.status.ActiveState != "active"

  # ---------------------------------------------------------------------------------------------------------------
  # Post-install NIC bonding (active-backup 'team0'), built AFTER the OS is up - mirrors the HVM provisioning model.
  # The install itself ran over a SINGLE management NIC (see the kickstart %pre). Here, when 'enable_nic_bonding' is
  # true AND a second management NIC (derived from the COM inventory) is present WITH a cable (carrier), we team it
  # with the primary into an active-backup bond carrying the same static IP. No switch-side LAG is required.
  # The builder is SELF-HEALING: if the freshly-built bond cannot reach the gateway (e.g. the second port lands on a
  # wrong/dead switch port on a non-LAG fabric - exactly the failure that black-holed the old install-time bond), it
  # automatically reverts to the single primary NIC, so the host is never left unreachable. It runs DETACHED
  # (systemd-run) so the brief connectivity blip while the IP moves onto the bond cannot kill the SSH task.
  - name: Build the post-install management NIC bond (active-backup, self-healing) on '{{ inventory_hostname }}'
    when: enable_nic_bonding | bool
    block:

      - name: Stage the NIC-bond setup script on '{{ inventory_hostname }}'
        remote_user: root
        copy:
          dest: /root/rhel_bond_setup.sh
          mode: "0755"
          content: |
            #!/bin/bash
            # Self-healing active-backup NIC bond builder (staged by the RHEL provisioning playbook).
            set -u
            LOG=/var/log/rhel_postinstall_bond.log
            exec >>"$LOG" 2>&1
            echo "=== $(date) RHEL post-install NIC bond setup ==="

            PRIMARY_MAC="{{ primary_nic_mac | default('') | lower }}"
            SECONDARY_MAC="{{ bond_member_macs[1] | lower if (bond_member_macs | default([]) | length) > 1 else '' }}"
            IPADDR="{{ os_ip_address }}"
            NETMASK="{{ netmask }}"
            GATEWAY="{{ gateway }}"
            DNS="{{ nameserver }}"
            MODE="{{ mgmt_bond_mode | default('active-backup') }}"

            # Convert dotted-quad netmask to a CIDR prefix (e.g. 255.255.252.0 -> 22).
            IFS=. read -r o1 o2 o3 o4 <<< "$NETMASK"
            mask=$(( (o1<<24)+(o2<<16)+(o3<<8)+o4 ))
            prefix=0
            for ((i=31;i>=0;i--)); do
                if (( (mask>>i)&1 )); then prefix=$((prefix+1)); else break; fi
            done

            dev_by_mac() {
                local want="${1,,}" n m
                [ -z "$want" ] && return 1
                for n in $(ls /sys/class/net | grep -v '^lo$'); do
                    m=$(cat "/sys/class/net/$n/address" 2>/dev/null | tr 'A-Z' 'a-z')
                    if [ "$m" == "$want" ]; then echo "$n"; return 0; fi
                done
                return 1
            }

            PRIMARY_DEV=$(dev_by_mac "$PRIMARY_MAC") || PRIMARY_DEV=""
            if [ -z "$PRIMARY_DEV" ]; then
                # Fall back to the device currently holding the install IP.
                PRIMARY_DEV=$(ip -o -4 addr show | awk -v ip="$IPADDR" '$4 ~ "^"ip"/" {print $2}' | head -n1)
            fi
            echo "Primary dev: ${PRIMARY_DEV:-<none>}"
            if [ -z "$PRIMARY_DEV" ]; then echo "ERROR: no primary device found, leaving network untouched"; echo error > /run/rhel_bond_result; exit 0; fi

            SECONDARY_DEV=""
            [ -n "$SECONDARY_MAC" ] && SECONDARY_DEV=$(dev_by_mac "$SECONDARY_MAC") || true
            echo "Secondary dev: ${SECONDARY_DEV:-<none>}"

            # Only bond when a secondary NIC exists AND has a cable (carrier) - mirrors the HVM teaming logic.
            if [ -z "$SECONDARY_DEV" ]; then echo "No secondary NIC -> staying single-NIC"; echo single > /run/rhel_bond_result; exit 0; fi
            ip link set "$SECONDARY_DEV" up 2>/dev/null || true
            sleep 2
            if [ "$(cat /sys/class/net/$SECONDARY_DEV/carrier 2>/dev/null || echo 0)" != "1" ]; then
                echo "Secondary $SECONDARY_DEV has no carrier -> staying single-NIC"; echo single > /run/rhel_bond_result; exit 0
            fi

            echo "Building active-backup bond team0 ($PRIMARY_DEV + $SECONDARY_DEV, primary=$PRIMARY_DEV)"
            nmcli -t -f NAME con show | grep -qx team0 && nmcli con delete team0
            nmcli con add type bond ifname team0 con-name team0 bond.options "mode=$MODE,primary=$PRIMARY_DEV,miimon=100"
            nmcli con mod team0 ipv4.method manual ipv4.addresses "$IPADDR/$prefix" ipv4.gateway "$GATEWAY" ipv4.dns "${DNS//,/ }" ipv6.method ignore
            for d in "$PRIMARY_DEV" "$SECONDARY_DEV"; do
                for c in $(nmcli -t -f NAME,DEVICE con show | awk -F: -v dv="$d" '$2==dv{print $1}'); do nmcli con delete "$c"; done
                nmcli con add type ethernet ifname "$d" master team0 con-name "bond-$d"
            done
            nmcli con up team0
            sleep 5

            if ping -c2 -W2 "$GATEWAY" >/dev/null 2>&1; then
                echo "Bond team0 reachable -> keeping bond"; echo bond > /run/rhel_bond_result; exit 0
            fi

            echo "Bond team0 UNREACHABLE -> reverting to single NIC $PRIMARY_DEV"
            nmcli con down team0 2>/dev/null || true
            nmcli con delete team0 2>/dev/null || true
            nmcli con delete "bond-$PRIMARY_DEV" 2>/dev/null || true
            nmcli con delete "bond-$SECONDARY_DEV" 2>/dev/null || true
            nmcli con add type ethernet ifname "$PRIMARY_DEV" con-name "mgmt-$PRIMARY_DEV" \
                ipv4.method manual ipv4.addresses "$IPADDR/$prefix" ipv4.gateway "$GATEWAY" ipv4.dns "${DNS//,/ }" ipv6.method ignore
            nmcli con up "mgmt-$PRIMARY_DEV"
            echo reverted > /run/rhel_bond_result
            exit 0

      - name: Run the NIC-bond setup detached (survives the IP move onto the bond)
        remote_user: root
        shell: |
          rm -f /run/rhel_bond_result
          systemd-run --unit=rhel-bond-setup --collect /bin/bash /root/rhel_bond_setup.sh
        # systemd-run returns immediately; the transient unit runs independently of this SSH session, so the
        # brief blip while the IP moves onto the bond cannot break this task.

      - name: Wait for '{{ inventory_hostname }}' to be reachable again after the bond/IP move
        remote_user: root
        wait_for_connection:
          delay: 8
          timeout: 240

      - name: Read the NIC-bond result marker
        remote_user: root
        slurp:
          src: /run/rhel_bond_result
        register: rhel_bond_result_raw
        failed_when: false

      - name: Report the NIC-bond outcome
        debug:
          msg: >-
            NIC bonding outcome for '{{ inventory_hostname }}':
            {{ (rhel_bond_result_raw.content | b64decode | trim) if (rhel_bond_result_raw.content is defined) else 'unknown (marker missing)' }}
            (bond = active-backup team0 kept | single = only one usable NIC | reverted = bond unreachable, fell back to single NIC | error = no primary NIC)



  - name: Wait a little while for things to stabilize
    pause: 
      seconds: 60

  # Wait for the communication between COM and SUT

  - name: Wait for COM to detect SUT service to be running
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ servers_API_version }}/servers/{{ server_id }}/inventory"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: sut_ServiceState
    until: sut_ServiceState.json['smartUpdateToolInventory'].data.ServiceState == "Running"
    retries: 7
    delay: 60
    delegate_to: localhost
    
  # # Command required if iLO Security mode is FIPS
  # - name: Configure SUT credentials to communicate with iLO
  #   remote_user: root
  #   command: sut -set ilousername="{{ iLO_username }}" ilopassword="{{ iLO_password }}"
  #   register: sut_credentials

  # - debug: msg="{{ sut_credentials.stdout }}"

  # # Command required if iLO configured in CAC mode
  # - name: Add iLO certificate for SUT to communicate with iLO
  #   remote_user: root
  #   command: sut -addcertificate /path/to/certificate.crt
  #   register: sut_certificate

  # - debug: msg="{{ sut_certificate.stdout }}"


#--------------------------------------Capture firmware bundle information --------------------------------------------------------------------------------------------

  - name: Collect firmware bundles
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ firmware_bundles_API_version }}/firmware-bundles"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: firmwarebundles
    delegate_to: localhost
    when: is_first_host

  # - debug: var=firmwarebundles

  # Gen10 firmware bundle

  - name: Set variable for Gen10 firmware bundle '{{ Gen10_10p_firmware_bundle_name }}'
    set_fact:
      Gen10_10p_firmware_bundle_ID:  "{{ (firmwarebundles | json_query(jq) )[0] }}"
    vars:
      jq: "json.items[?contains(releaseVersion, '{{ Gen10_10p_firmware_bundle_name }}') && contains(name, 'Gen10')].id"
    when: is_first_host and (Gen10_10p_firmware_bundle_name is defined) and (Gen10_10p_firmware_bundle_name|length > 0) and (firmwarebundles | json_query(jq) )[0] | default([]) != []

  - name:  Exit if Gen10 firmware bundle '{{ Gen10_10p_firmware_bundle_name }}' does not exist
    fail:
      msg: "Gen10 firmware bundle '{{ Gen10_10p_firmware_bundle_name }}' does not exist!"
    when: is_first_host and (Gen10_10p_firmware_bundle_name is defined) and (Gen10_10p_firmware_bundle_name|length > 0) and Gen10_10p_firmware_bundle_ID is not defined

  - debug: var=Gen10_10p_firmware_bundle_ID
    when: is_first_host and (Gen10_10p_firmware_bundle_name is defined) and (Gen10_10p_firmware_bundle_name|length > 0)
    
   # Gen11 firmware bundle
  
  - name: Set variable for Gen11 firmware bundle '{{ Gen11_firmware_bundle_name }}'
    set_fact:
      Gen11_firmware_bundle_ID:  "{{ (firmwarebundles | json_query(jq) )[0] }}"
    vars:
      # query: "json.items[?releaseVersion=='{{ Gen11_firmware_bundle_name }}'].id"
      jq: "json.items[?contains(releaseVersion, '{{ Gen11_firmware_bundle_name }}') && contains(name, 'Gen11')].id"
    when: is_first_host and (Gen11_firmware_bundle_name is defined) and (Gen11_firmware_bundle_name|length > 0) and (firmwarebundles | json_query(jq) )[0] | default([]) != []

  - name: Exit if Gen11 firmware bundle '{{ Gen11_firmware_bundle_name }}' does not exist
    fail:
      msg: "Gen11 firmware bundle '{{ Gen11_firmware_bundle_name }}' does not exist!"
    when: is_first_host and (Gen11_firmware_bundle_name is defined) and (Gen11_firmware_bundle_name|length > 0) and Gen11_firmware_bundle_ID is not defined

  - debug: var=Gen11_firmware_bundle_ID
    when: is_first_host and (Gen11_firmware_bundle_name is defined) and (Gen11_firmware_bundle_name|length > 0)
 
  # Gen12 firmware bundle
  
  - name: Set variable for Gen12 firmware bundle '{{ Gen12_firmware_bundle_name }}'
    set_fact:
      Gen12_firmware_bundle_ID:  "{{ (firmwarebundles | json_query(jq) )[0] }}"
    vars:
      # query: "json.items[?releaseVersion=='{{ Gen12_firmware_bundle_name }}'].id"
      jq: "json.items[?contains(releaseVersion, '{{ Gen12_firmware_bundle_name }}') && contains(name, 'Gen12')].id"
    when: is_first_host and (Gen12_firmware_bundle_name is defined) and (Gen12_firmware_bundle_name|length > 0) and (firmwarebundles | json_query(jq) )[0] | default([]) != []

  - name: Exit if Gen12 firmware bundle '{{ Gen12_firmware_bundle_name }}' does not exist
    fail:
      msg: "Gen12 firmware bundle '{{ Gen12_firmware_bundle_name }}' does not exist!"
    when: is_first_host and (Gen12_firmware_bundle_name is defined) and (Gen12_firmware_bundle_name|length > 0) and Gen12_firmware_bundle_ID is not defined

  - debug: var=Gen12_firmware_bundle_ID
    when: is_first_host and (Gen12_firmware_bundle_name is defined) and (Gen12_firmware_bundle_name|length > 0)

  # Failure if firmware bundles set are not found

  - name: Fail if the firmware baselines for Gen10/Gen10+, Gen11, and Gen12 servers could not be found.
    fail:
      msg: 'The firmware bundles for Gen10/Gen10+, Gen11, and Gen12 servers could not be found, check your firmware baseline variables.' 
    when: is_first_host and Gen10_10p_firmware_bundle_ID is not defined and Gen11_firmware_bundle_ID is not defined and Gen12_firmware_bundle_ID is not defined

  - name: Fail if the firmware baseline for Gen10/Gen10+ servers could not be found.
    fail:
      msg: 'The firmware bundle for Gen10/Gen10+ servers could not be found, check your firmware baseline variables.' 
    when: is_first_host and Gen10_10p_firmware_bundle_ID is not defined 

  - name: Fail if the firmware baseline for Gen11 servers could not be found.
    fail:
      msg: 'The firmware bundle for Gen11 servers could not be found, check your firmware baseline variables.' 
    when: is_first_host and Gen11_firmware_bundle_ID is not defined 

  - name: Fail if the firmware baseline for Gen12 servers could not be found.
    fail:
      msg: 'The firmware bundle for Gen12 servers could not be found, check your firmware baseline variables.' 
    when: is_first_host and Gen12_firmware_bundle_ID is not defined     

  # Set firmware bundle id for the server generation

  - name: Set firmware bundle id for Gen10/Gen10+ server
    set_fact: 
      bundle_id: "{{ Gen10_10p_firmware_bundle_ID }}"
    when: is_first_host and server_generation == "GEN_10"
 
  - name: Set firmware bundle id for Gen11 server
    set_fact: 
      bundle_id: "{{ Gen11_firmware_bundle_ID }}"
    when: is_first_host and server_generation == "GEN_11"

  - name: Set firmware bundle id for Gen12 server
    set_fact: 
      bundle_id: "{{ Gen12_firmware_bundle_ID }}"
    when: is_first_host and server_generation == "GEN_12"

  - debug: var=bundle_id
    when: is_first_host

  # Create the firmware server setting 

  - name: Check if the firmware server setting '{{ firmware_server_setting_name }}' exists
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ settings_API_version }}/settings?filter={{ filter | urlencode }}"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    vars:
      filter: "name eq '{{ firmware_server_setting_name }}'"
    register: firmware_server_setting
    delegate_to: localhost
    when: is_first_host

  # - debug: var=firmware_server_setting

  - name: Create the firmware server setting '{{ firmware_server_setting_name }}' 
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ settings_API_version }}/settings"
      method: POST
      status_code: 201
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/json"
      body_format: json
      body:
        name: "{{ firmware_server_setting_name }}"
        description: "Firmware baseline for RHEL 9.3"
        category: "FIRMWARE"
        settings:
          GEN10:
            id: "{{ Gen10_10p_firmware_bundle_ID }}"
          GEN11:
            id: "{{ Gen11_firmware_bundle_ID }}"
          GEN12:
            id: "{{ Gen12_firmware_bundle_ID }}"
    register: firmware_server_setting_result
    when: is_first_host and firmware_server_setting.json.count == 0
    delegate_to: localhost

  - name: Display response of the firmware server setting '{{ firmware_server_setting_name }}' creation request
    debug: var=firmware_server_setting_result.msg
    when: is_first_host and firmware_server_setting.json.count == 0

  - name: Set variable for the resourceuri of the firmware server setting '{{ firmware_server_setting_name }}' just created
    set_fact: 
      firmware_server_setting_resourceuri: "{{ firmware_server_setting_result.json.resourceUri }}"
    when: is_first_host and firmware_server_setting.json.count == 0

  - name: Update the firmware server setting '{{ firmware_server_setting_name }}' 
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ settings_API_version }}/settings/{{ firmware_server_setting_id }}"
      method: PATCH
      status_code: 200
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/merge-patch+json"
      body_format: json
      body:
        name: "{{ firmware_server_setting_name }}"
        description: "Firmware baseline for RHEL 9.3"
        settings:
          GEN10:
            id: "{{ Gen10_10p_firmware_bundle_ID }}"
          GEN11:
            id: "{{ Gen11_firmware_bundle_ID }}"
          GEN12:
            id: "{{ Gen12_firmware_bundle_ID }}"
    vars: 
      firmware_server_setting_id: "{{ firmware_server_setting | json_query('json.items[0].id')  }}"
    register: firmware_server_setting_result
    when: is_first_host and firmware_server_setting.json.count == 1
    delegate_to: localhost

  - name: Display response of the firmware server setting '{{ firmware_server_setting_name }}' update task
    debug: var=firmware_server_setting_result.msg
    when: is_first_host and firmware_server_setting.json.count == 1
    
  - name: Set variable for the resourceuri of the firmware server setting '{{ firmware_server_setting_name }}' just updated
    set_fact: 
      firmware_server_setting_resourceuri: "{{ firmware_server_setting | json_query('json.items[0].resourceUri') }}"
    when: is_first_host and firmware_server_setting.json.count == 1

  - debug: var=firmware_server_setting_resourceuri
    when: is_first_host


#--------------------------------------Firmware update preparation: Create a definitive server group or update if existing --------------------------------------------

 # Check if definitive server group exists
  
  - name: Check if definitive group '{{ server_group_name }}' already exist
    uri:
      url:  "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ groups_API_version }}/groups?filter={{ filter | urlencode }}"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    vars: 
      filter: "name eq '{{ server_group_name }}'"      
    register: definitive_server_group
    delegate_to: localhost
    when: is_first_host

  # - debug: var=definitive_server_group

  # Create the definitive server group if it does not exist

  - name: Create definitive group '{{ server_group_name }}' if it does not exist
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ groups_API_version }}/groups"
      method: POST
      status_code: 201
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/json"
      body_format: json
      body:
        name: "{{ server_group_name }}"
        description: "Server group for RHEL servers"
        deviceType: "DIRECT_CONNECT_SERVER"
        settingsUris: 
          - "{{ bios_server_setting_resourceuri }}"     
          - "{{ firmware_server_setting_resourceuri }}"     
        policies:
          onDeviceAdd:
            biosApplySettings: false
            biosFactoryReset: false
            firmwarePowerOff: false
            firmwareUpdate: false
            iloApplySettings: false
            osInstall: false
            storageConfiguration: false
            storageVolumeDeletion: false
            storageVolumeName: ""
            externalStorageConfiguration: false
            osCompletionTimeoutMin: 240
          onDeviceApply:
            firmwareDowngrade: "{{ firmware_downgrade_policy }}"
        # autoAddTags: 
    register: definitive_server_group_result
    when: is_first_host and definitive_server_group.json.count == 0
    delegate_to: localhost

  - name: Display response of the definitive group '{{ server_group_name }}' creation request
    debug: var=definitive_server_group_result.msg
    when: is_first_host and definitive_server_group.json.count == 0

  - name: Set variables for the id and the resourceUri of the definitive group '{{ server_group_name }}' just created
    set_fact:
      definitive_group_id: "{{ definitive_server_group_result.json.id }}" 
      definitive_group_resourceuri: "{{ definitive_server_group_result.json.resourceUri }}"
    when: is_first_host and definitive_server_group.json.count == 0

  # Update the definitive server group if the group exists
    
  - name: Update definitive group '{{ server_group_name }}' if it does exist
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ groups_API_version }}/groups/{{ group_id }}"
      method: PATCH
      status_code: 200
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/merge-patch+json"
      body_format: json
      body:
        name: "{{ server_group_name }}"
        description: "Server group for RHEL server"
        settingsUris: 
          - "{{ bios_server_setting_resourceuri }}"   
          - "{{ firmware_server_setting_resourceuri }}"     
        policies:
          onDeviceAdd:
            biosApplySettings: false
            biosFactoryReset: false
            firmwarePowerOff: false
            firmwareUpdate: false
            iloApplySettings: false
            osInstall: false
            storageConfiguration: false
            storageVolumeDeletion: false
            storageVolumeName: ""
            externalStorageConfiguration: false
            osCompletionTimeoutMin: 240
          onDeviceApply:
            firmwareDowngrade: "{{ firmware_downgrade_policy }}"
        # autoAddTags:  
    vars: 
      group_id: "{{ definitive_server_group  | json_query('json.items[0].id') }}"
    register: definitive_server_group_result
    when: is_first_host and definitive_server_group.json.count == 1
    delegate_to: localhost

  - name: Display response of the group '{{ server_group_name }}' update request
    debug: var=definitive_server_group_result.msg
    when: is_first_host and definitive_server_group.json.count == 1

  - name: Set variables for the id and the resourceUri of the existing definitive group '{{ server_group_name }}' just updated
    set_fact:
      definitive_group_id: "{{ definitive_server_group | json_query('json.items[0].id') }}" 
      definitive_group_resourceuri: "{{ definitive_server_group | json_query('json.items[0].resourceUri') }}"
    when: is_first_host and definitive_server_group.json.count == 1

  - debug: var=definitive_group_id  
    when: is_first_host

  - debug: var=definitive_group_resourceuri
    when: is_first_host


#--------------------------------------Adding server to definitive server group and starting group firmware update (including HPE drivers and software) ---------------------

  # Capture the start time of the firmware update
  - name: Gather subset facts on localhost
    setup:
      gather_subset: [all]
    delegate_to: localhost

  - name: Capture the start time of the firmware update (will be used later to filter COM activities, etc.)
    set_fact:
      firmware_update_start_time: "{{ ansible_date_time.iso8601 }}"

  - name: Display the start time of the firmware update
    debug: 
      msg: "{{ firmware_update_start_time }}"

  - name: Get definitive group '{{ server_group_name }}' information
    uri:
      url:  "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ groups_API_version }}/groups?filter={{ filter | urlencode }}"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    vars: 
      filter: "name eq '{{ server_group_name }}'"      
    register: definitive_server_group
    delegate_to: localhost

  - name: Set variable for existing definitive group '{{ server_group_name }}' id
    set_fact:
      definitive_group_id: "{{ definitive_server_group | json_query('json.items[0].id') }}" 
      
  # Check if the server is already member of the definitive server group if it does exist

  - name: Check if server '{{ serial_number }}' is already member of definitive server group '{{ server_group_name }}' 
    set_fact: 
      server_found_in_definitive_group: "{{ definitive_server_group  | json_query(jq) }}"
    vars:
      jq: "json.items[0].devices[?serial=='{{ serial_number }}']"
    when: definitive_server_group.json.count == 1
      
  # - debug: var=server_found_in_definitive_group  

  # Remove the server from the definitive server group if it's already part of it (which shouldn't be the case, unless the playbook has failed and been rerun)

  # - name: Remove server '{{ serial_number }}' from definitive server group '{{ server_group_name }}' if it is already a member
  #   uri:
  #     url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ groups_API_version }}/groups/{{ definitive_group_id }}/devices/{{ server_id }}"
  #     method: DELETE
  #     status_code: 204
  #     headers:
  #       Authorization: "Bearer {{ access_token }}"
  #   when: server_found_in_definitive_group is defined and server_found_in_definitive_group | length != 0
  #   register: group_unassignment_result
  #   delegate_to: localhost

  # - name: Wait for deletion to complete
  #   pause:
  #     seconds: 15
  #   when: server_found_in_definitive_group is defined and server_found_in_definitive_group | length != 0
    
  # Add server to the definitive server group 

  - name: Add server '{{ serial_number }}' to definitive server group '{{ server_group_name }}'
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ groups_API_version }}/groups/{{ definitive_group_id }}/devices"
      method: POST
      status_code: 202
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/json"
      body_format: json
      body:
        devices:
          - deviceId: "{{ server_id }}"
    register: group_assignment_result
    when: server_found_in_definitive_group is not defined or server_found_in_definitive_group | length == 0
    delegate_to: localhost

  - name: Display response of the group assignment task
    debug: var=group_assignment_result.msg
    when: server_found_in_definitive_group is not defined or server_found_in_definitive_group | length == 0

  - name: Wait for assignment to truly complete
    pause:
      seconds: 15
    when: server_found_in_definitive_group is not defined or server_found_in_definitive_group | length == 0

  # Start an HPE drivers, software and firmware update job

  # Firmware is updated in ONE group job that targets ONLY the servers being provisioned in THIS inventory run (in
  # parallel), not every member of the definitive group. The job is submitted exactly ONCE (guarded with is_first_host)
  # against the group (resourceType 'compute-ops-mgmt/group', resourceId = definitive group id) because the firmware
  # baseline lives on the group; 'jobParams.devices' narrows the scope to this run's servers, so servers added to the
  # group by a PREVIOUS run are left untouched. The device list is built from each play host's 'server_id' (already in
  # the API device-id form '<partNumber>+<serialNumber>', e.g. 'P28948-B21+CZ2311004H'). Under the default 'linear'
  # strategy every host is already in the group with its 'server_id' fact by the time the first host submits the job.

  # If updating HPE drivers, software and firmware takes a long time, it's safer to ask for a new COM token now

  - name: Create a new HPE Compute Ops Management session to avoid token expiration during the firmware update job
    import_tasks: files/Create_COM_session.yml

  - name: Build the list of device ids for the servers being provisioned in this run (first host only)
    set_fact:
      server_ids: "{{ ansible_play_hosts | map('extract', hostvars, 'server_id') | list }}"
    when: is_first_host

  - name: Display the device ids targeted by the firmware update job (first host only)
    debug:
      msg: "Firmware update will target these {{ server_ids | length }} server(s): {{ server_ids }}"
    when: is_first_host

  - name: Start a single group firmware update job for this run's servers (first host only)
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ jobs_API_version }}/jobs"
      method: POST
      status_code: 201
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/json"
      body_format: json
      body:
        jobTemplate: "{{ GroupFirmwareUpdate_job_template_id }}"
        resourceId: "{{ definitive_group_id }}"
        resourceType: "compute-ops-mgmt/group"
        jobParams: 
          devices: "{{ server_ids }}"
          parallel: true
          stopOnFailure: false
          installSWDrivers: "{{ install_SWDrivers_policy }}"
          downgrade: "{{ firmware_downgrade_policy }}"
          powerOff: false
    register: group_firmware_update_job
    delegate_to: localhost
    when: is_first_host

  - name: Display response of the group firmware update job (first host only)
    debug: var=group_firmware_update_job.msg
    when: is_first_host


#--------------------------------------Wait until the update of the HPE server drivers, software and firmware is complete. --------------------------------------------

  - name: Capture the resourceUri of the group firmware update job (first host only)
    set_fact:
      group_firmware_update_job_resourceUri: "{{ group_firmware_update_job.json.resourceUri }}"
    when: is_first_host

  - name: Display the group firmware update job resource uri (first host only)
    debug: var=group_firmware_update_job_resourceUri
    when: is_first_host
 
  - name: Wait for the group firmware update job to complete (first host only)
    uri:
      url: "{{ ConnectivityEndpoint }}{{ group_firmware_update_job_resourceUri }}"
      method: GET
      return_content: yes
      headers:
        Authorization: "Bearer {{ access_token }}"
    retries: 600
    delay: 60
    until: >
      (group_firmware_update_job_status.json.state == "COMPLETE" or 
      group_firmware_update_job_status.json.state == "ERROR")
    register: group_firmware_update_job_status
    ignore_errors: yes
    changed_when: false
    delegate_to: localhost
    when: is_first_host

  # - debug: var=group_firmware_update_job_status

  - name: Display the group firmware update job result (first host only)
    debug: 
      msg:
        - "State: {{ group_firmware_update_job_status.json.state }}"
        - "ResultCode: {{ group_firmware_update_job_status.json.resultCode }}"
        - "Status: {{ group_firmware_update_job_status.json.status }}"
    when: is_first_host

 # Display the server firmware update activity status

  - name: Get the latest activity of server '{{ serial_number }}'
    uri:
      url:  "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ activities_API_version }}/activities?filter={{ filter | urlencode  }}"  
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    vars: 
      filter: "associatedServerId eq '{{ server_id }}' and createdAt gt {{ firmware_update_start_time }}"      
    register: Server_activity_status
    delegate_to: localhost

  # - debug: var=Server_activity_status

  - name: Extract items containing 'Firmware update'  
    set_fact:
      firmware_update_items: "{{ (Server_activity_status | json_query(jq))[0] }}"
    vars:
      jq: "json.items[? contains(name, 'Firmware update') && contains(groupDisplayName, '{{ server_group_name }}')]"

  # - debug: var=firmware_update_items

  - name: Display the firmware update activity status when successful 
    vars:
      msg: |
          Message: {{ firmware_update_items.message }}
    debug:
      msg: "{{ msg.split('\n') }}"
    when: firmware_update_items.message is search('Firmware update successful', ignorecase=True)

  - name: Display the firmware update activity status with recommanded actions when failed
    vars:
      msg: |
          Message: {{ firmware_update_items.message }}

          Recommended action:
          {{ firmware_update_items.recommendedAction  | regex_replace('\\n', '\n') | regex_replace('\n\n', '\n') }}
    debug:
      msg: "{{ msg.split('\n') }}"
    when: firmware_update_items.message is search('Firmware update failed', ignorecase=True)
    
  # Capture last firmware update information

  - name: Capture server information   
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ servers_API_version }}/servers?filter=hardware/serialNumber%20eq%20'{{ serial_number }}'"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: server
    delegate_to: localhost
  
  - name: Capture last firmware update information if any
    set_fact:
      last_firmware_update: "{{ server | json_query('json.items[0].lastFirmwareUpdate') }}"
    when: (server | json_query('json.items[0].lastFirmwareUpdate')) is not none

  # - debug: var=last_firmware_update.attemptedAt

  - name: Display server last firmware update information if up-to-date
    debug: 
      msg: "{{ last_firmware_update }}"  
    when: last_firmware_update is defined and last_firmware_update.attemptedAt > firmware_update_start_time


  # # Wait until the RHEL host is accessible again if a reboot was necessary to activate some firmware components

  # - name: Wait for '{{ os_ip_address }}' to respond on port 22...
  #   wait_for:
  #     timeout: 2000
  #     host: "{{ os_ip_address }}"
  #     port: 22
  #   delegate_to: localhost


#--------------------------------------Display end-of-installation message --------------------------------------------------------------------------------------------

  # Get the runtime

  - name: Force update of current timestamp
    setup: filter='ansible_date_time'
    delegate_to: localhost

  - name: Get runtime
    # ansible-core 2.19 refuses to store native objects (a datetime subtraction yields a 'timedelta',
    # which raises "Type 'timedelta' is unsupported for variable storage"). Cast to string for storage/display.
    set_fact:
      runtime: "{{ ((ansible_date_time.iso8601[:19] | to_datetime('%Y-%m-%dT%H:%M:%S')) - (start_time[:19] | to_datetime('%Y-%m-%dT%H:%M:%S'))) | string }}"

  # Display server installation completed message

  - name: Status of the OS installation with the firmware update with HPE drivers and software
    debug:
      msg:
        - "{{ inventory_hostname }}.{{domain}} installation and firmware update completed successfully!"
        - "OS is configured and running with the HPE drivers and software."
        - "To SSH to the new host from Ansible control node, use: ssh root@{{ inventory_hostname }}.{{domain}}"
        - "The provisioning task took {{ runtime }}."
    when: (firmware_update_items.message is search('Firmware update successful', ignorecase=True)) and (install_SWDrivers_policy|bool == True)
 
  - name: Status of the OS installation with the firmware update without HPE drivers and software
    debug:
      msg:
        - "{{ inventory_hostname }}.{{domain}} installation and firmware update completed successfully!"
        - "OS is configured and running. To SSH to the new host from Ansible control node, run: ssh root@{{ inventory_hostname }}.{{domain}}"
        - "The provisioning task took {{ runtime }}."
    when: (firmware_update_items.message is search('Firmware update successful', ignorecase=True)) and (install_SWDrivers_policy|bool == False)    
   
  - name: Status of the OS installation with firmware update failure
    debug:
      msg:
        - "{{ inventory_hostname }}.{{domain}} installation completed but the firmware update operation failed to complete!"  
        - "OS is configured and running."
        - "Refer to the individual server activity entries in the HPE Compute Ops Management UI for more details."
        - "To SSH to the new host from Ansible control node, use: ssh root@{{ inventory_hostname }}.{{domain}}"
        - "The provisioning task took {{ runtime }}."
    # 'group_firmware_update_job_status' is registered only on the first host (the group firmware update job runs
    # once for the whole run). Non-first hosts hold a skipped-result/undefined value with no '.json', so gate that
    # part on 'is_first_host' and use '.get()' (ansible-core 2.19 RAISES on missing dict attributes). Non-first
    # hosts fall back to their own per-host 'firmware_update_items.message'.
    when: >-
      (firmware_update_items.message is search('Firmware update failed', ignorecase=True))
      or (is_first_host and (((group_firmware_update_job_status | default({})).get('json') or {}).get('resultCode') is none))


    