---
# =====================================================================================================================
# Automated HPE Morpheus VM Essentials - HVM OS (Ubuntu 24.04) installation on HPE Compute Ops Management server(s)
# using an auto-generated ISO file with a customized Ubuntu autoinstall (cloud-init) seed.
#
#  Command that can be used to run this playbook:
#
#   $ ansible-playbook -i hosts_HVM HVM_provisioning.yml --ask-vault-password --ask-become-pass
#
#   With a pass file containing the vault/become password:
#   $ ansible-playbook -i hosts_HVM HVM_provisioning.yml --become-password-file pass --vault-password-file pass
#
#  Note: Make sure to provide the list of servers to be provisioned with their details in the inventory file 'hosts_HVM'
#
#  High level workflow:
#    1.  Create a DNS record for each host (Windows DNS / WinRM)
#    2.  Authenticate with HPE Compute Ops Management (COM) and capture job template IDs
#    3.  Discover the server, power it on and collect the local storage inventory
#    4.  Detect the OS boot volume (NS204i / MR / SR / local disk) and create the internal storage setting if needed
#    5.  Create a temporary COM server group with the BIOS (and storage) settings
#    6.  Build a per-host HVM Install ISO with the customized Ubuntu autoinstall seed and host it on nginx
#    7.  Create the COM OS image setting and start the group OS installation job
#    8.  Wait for the installation to complete and the host to be reachable over SSH
#    9.  Update the HVM host packages (apt) and configure NTP (chrony)         [Play 2, over SSH]
#    10. Optionally update HPE firmware/drivers via COM                        [Play 3]
#    11. Create the HVM cluster in the VME Manager if missing and add the host [Play 3]
#    12. Team a cabled second management NIC into an OVS bond (redundancy)     [Play 4, over SSH]
# =====================================================================================================================


# ---------------------------------------------------------------------------------------------------------------------
#  Play 0 - DNS record (WinRM Mode)
# ---------------------------------------------------------------------------------------------------------------------

- name: DNS record for the bare metal HVM server
  hosts: All
  gather_facts: no
  vars:
    ansible_forks: 5
  vars_files:
    - vars/Windows_DNS_vars_encrypted.yml
  tasks:
    - name: Add '{{ inventory_hostname }}' with '{{ os_ip_address }}' on '{{ dns_server }}' in '{{ domain }}' DNS domain
      ansible.windows.win_dns_record:
        name: "{{ inventory_hostname }}"
        type: "A"
        value: "{{ os_ip_address }}"
        zone: "{{ domain }}"
        state: present
      delegate_to: "{{ dns_server }}"


# ---------------------------------------------------------------------------------------------------------------------
#  Play 1 - Bare metal provisioning (COM orchestration, runs from the Ansible control node)
# ---------------------------------------------------------------------------------------------------------------------

- name: Automated HVM OS (Ubuntu 24.04) installation on HPE Compute Ops Management server(s)
  hosts: All
  gather_facts: no
  vars_files:
    - vars/GLP_COM_API_credentials_encrypted.yml
    - vars/VME_Manager_vars_encrypted.yml
    - vars/HVM_vars.yml
    - vars/api_versions.yml
  vars:
    inventory_fqdn: "{{ inventory_hostname | lower }}.{{ domain }}"
    ansible_host_key_checking: false
    validate_certs: false
    user: "{{ lookup('env', 'USER') }}"
    ssh_known_hosts_file: "{{ lookup('env','HOME') + '/.ssh/known_hosts' }}"
    ansible_ssh_public_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
    ansible_forks: 5

  tasks:

#--------------------------------------Capture start time--------------------------------------------------------------

  - name: Gather subset facts on localhost
    setup:
      gather_subset: [all]
    delegate_to: localhost

  - name: Capture the start time (used later to filter COM activities and compute the playbook runtime)
    set_fact:
      start_time: "{{ ansible_date_time.iso8601 }}"

  - debug: var=start_time

  - name: Set fact for the first host in inventory
    set_fact:
      is_first_host: "{{ ansible_play_batch[0] == inventory_hostname }}"


#--------------------------------------Authentication with COM---------------------------------------------------------

  - name: Create HPE Compute Ops Management session
    import_tasks: files/Create_COM_session.yml


#--------------------------------------Capture Job Templates IDs-------------------------------------------------------

  - name: Capture Job Templates IDs
    import_tasks: files/Get_job_templates_id.yml


#--------------------------------------Ensure hostname is supported ---------------------------------------------------

  - name: Ensure hostname is supported for HVM server '{{ inventory_hostname }}'
    assert:
      that:
        - inventory_hostname is match('^[a-zA-Z0-9-]+$')          # Only letters, digits, and hyphens
        - not (inventory_hostname is match('^-'))                 # Not start with hyphen
        - not (inventory_hostname.endswith('-'))                  # Not end with hyphen
        - not (inventory_hostname is match('^[0-9]+$'))           # Not all numeric
      fail_msg: "Invalid hostname '{{ inventory_hostname }}'. Hostname must only contain letters, digits, and hyphens."


#--------------------------------------Capture server information -----------------------------------------------------

  - name: Capture server '{{ serial_number }}' information
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ servers_API_version }}/servers?filter=hardware/serialNumber%20eq%20'{{ serial_number }}'"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: server
    delegate_to: localhost

  - name: Exit if server '{{ serial_number }}' does not exist
    fail:
      msg: "Server '{{ serial_number }}' cannot be found in COM!"
    when: server.json.count == 0

  - name: Capture server '{{ serial_number }}' id, uri and connection status
    set_fact:
      server_id: "{{ server | json_query('json.items[0].id') }}"
      server_resourceUri: "{{ server | json_query('json.items[0].resourceUri') }}"
      server_connected_status: "{{ server | json_query('json.items[0].state.connected') }}"

  - name: Exit if server '{{ serial_number }}' is not connected to COM
    fail:
      msg:
        - "Server '{{ serial_number }}' is not connected to COM!"
        - "Make sure to connect the server's iLO to COM ! Go to iLO UI / Management / Compute Ops Management"
    when: server_connected_status == false

  # When a server has just been added to COM or is rebooting/re-discovering, the hardware fields (serverGeneration,
  # model, powerState, iLO IP) are transiently reported as 'UNKNOWN' or empty. Wait until they are populated before
  # capturing them, otherwise the power-on logic below (which keys off 'server_power_state') runs on bogus data.
  - name: Wait until server '{{ serial_number }}' hardware information (generation, model, power state) is populated
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ servers_API_version }}/servers?filter=hardware/serialNumber%20eq%20'{{ serial_number }}'"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: server
    until:
      - (server | json_query('json.items[0].serverGeneration') | default('UNKNOWN', true)) not in ['UNKNOWN', '']
      - (server | json_query('json.items[0].hardware.model') | default('', true)) | length > 0
      - (server | json_query('json.items[0].hardware.powerState') | default('UNKNOWN', true)) not in ['UNKNOWN', '']
    retries: 30
    delay: 20
    delegate_to: localhost

  - name: Capture server '{{ serial_number }}' generation, model, power state and iLO IP
    set_fact:
      server_generation: "{{ server | json_query('json.items[0].serverGeneration') }}"
      server_model: "{{ server | json_query('json.items[0].hardware.model') }}"
      server_ilo_ip: "{{ server | json_query('json.items[0].hardware.bmc.ip') }}"
      server_power_state: "{{ server | json_query('json.items[0].hardware.powerState') }}"

  - debug:
      msg:
        - "Generation: {{ server_generation }}"
        - "Model: {{ server_model }}"
        - "ID: {{ server_id }}"
        - "Connection status: {{ server_connected_status }}"
        - "iLO IP: {{ server_ilo_ip }}"
        - "Power state: {{ server_power_state }}"

  - name: Wait until the server '{{ serial_number }}' inventory information is available then capture the data
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ servers_API_version }}/servers/{{ server_id }}/inventory"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: server_inventory
    failed_when: server_inventory.status != 200 and server_inventory.status != 404
    until: server_inventory.status == 200
    retries: 30
    delay: 60
    delegate_to: localhost

  - name: Wait until the complete discovery of server '{{ serial_number }}' is complete
    uri:
      url: "{{ ConnectivityEndpoint }}/ui-doorway/compute/v2/servers/{{ server_id }}"
      method: GET
      return_content: yes
      status_code: 200
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: server_inventory_from_ui_doorway
    until: server_inventory_from_ui_doorway.json.get('state_') != "Retrieving server information in progress"
    retries: 30
    delay: 60
    delegate_to: localhost

  - name: Power on the server '{{ serial_number }}' to get the storage inventory information (only if not already ON)
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ jobs_API_version }}/jobs"
      method: POST
      status_code: 201
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/json"
      body_format: json
      body:
        jobTemplate: "{{ PowerOn_New_job_template_id }}"
        resourceId: "{{ server_id }}"
        resourceType: "compute-ops-mgmt/server"
    register: power_on_job_result
    when: server_power_state != "ON"
    delegate_to: localhost

  - name: Report that server '{{ serial_number }}' is already powered on (skipping power on)
    debug:
      msg: "Server '{{ serial_number }}' is already powered on (power state '{{ server_power_state }}'). Skipping the power on job."
    when: server_power_state == "ON"

  - name: Set a variable for the job resource URI
    set_fact:
      job_resourceUri: "{{ power_on_job_result.json.resourceUri }}"
    when: server_power_state != "ON"

  - name: Wait for the server power on job to complete
    uri:
      url: "{{ ConnectivityEndpoint }}{{ job_resourceUri }}"
      method: GET
      return_content: yes
      headers:
        Authorization: "Bearer {{ access_token }}"
    retries: 60
    delay: 5
    until: >
      (server_power_on_job_status.json.state == "COMPLETE" or
      server_power_on_job_status.json.state == "ERROR")
    register: server_power_on_job_status
    when: server_power_state != "ON"
    delegate_to: localhost

  - name: Exit when server power on job is failing
    fail:
      msg: "Error ! Server power on job has failed !"
    when:
      - server_power_state != "ON"
      - server_power_on_job_status.json.state == "ERROR"


#--------------------------------------Check BIOS/Workload profile settings -------------------------------------------

  - name: Check if workload profile '{{ workload_profile_name }}' exists
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ settings_API_version }}/settings?filter={{ filter | urlencode }}"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    vars:
      filter: "category eq 'BIOS' and name eq '{{ workload_profile_name }}'"
    register: bios_server_setting
    delegate_to: localhost

  - name: Exit if workload profile '{{ workload_profile_name }}' does not exist
    fail:
      msg: "Workload profile '{{ workload_profile_name }}' does not exist!"
    when: bios_server_setting.json.count == 0

  - name: Set a variable for the resourceUri of workload profile '{{ workload_profile_name }}'
    set_fact:
      bios_server_setting_resourceuri: "{{ bios_server_setting | json_query('json.items[0].resourceUri') }}"


#-------------------------------------- Collect the local storage information -----------------------------------------

  # COM populates the PCI device inventory ('device.data') and the storage inventory ('storage.data') INDEPENDENTLY, and
  # the storage array can lag well behind the PCI one (observed on Gen10 Plus: 'device.data' full while 'storage.data'
  # was still empty). The storage-controller detection below relies on 'storage.data', so we must wait until it is
  # actually populated - i.e. at least one controller reports Drives or Volumes - not just until 'device.data' appears.
  # Waiting on the wrong array made the playbook run the detection against empty storage data and wrongly fail with
  # "No storage controller with drives available found in the server".
  - name: Wait until the storage inventory of server '{{ serial_number }}' is populated then capture the inventory
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ servers_API_version }}/servers/{{ server_id }}/inventory"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: server_inventory
    until:
      - (server_inventory.json.device.data | default([]) | length) > 0
      - ((server_inventory.json.storage.data | default([]) | selectattr('Drives', 'defined') | map(attribute='Drives') | map('length') | sum)
         + (server_inventory.json.storage.data | default([]) | selectattr('Volumes', 'defined') | map(attribute='Volumes') | map('length') | sum)) > 0
    retries: 30
    delay: 60
    delegate_to: localhost

  - name: Capture the server '{{ serial_number }}' inventory information
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ servers_API_version }}/servers/{{ server_id }}/inventory"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    register: server_inventory
    delegate_to: localhost


#-------------------------------------- Management bond NIC selection (auto MAC discovery) -----------------------------

  # When 'bond_member_selection' is 'auto', derive the mgmt bond member MAC addresses from the COM network inventory
  # instead of relying on interface names (which differ across ProLiant generations/adapters). We take the first
  # 'bond_member_count' Ethernet ports of the adapter whose Name/Model matches 'bond_member_adapter_match'. The seed
  # then matches these ports by MAC in netplan, so it is generation-independent.

  - name: Show the raw network adapter inventory for server '{{ serial_number }}' (troubleshooting)
    debug:
      var: server_inventory.json.networkAdapter.data
      verbosity: 1
    when: bond_member_selection | default('manual') == 'auto'

  - name: Derive the mgmt bond member MAC addresses from the COM inventory of server '{{ serial_number }}'
    set_fact:
      bond_member_macs: >-
        {%- set ns = namespace(macs=[]) -%}
        {%- for a in server_inventory.json.networkAdapter.data | default([]) -%}
        {%-   set aname = ((a.Name | default('')) ~ ' ' ~ (a.Model | default('')) ~ ' ' ~ (a.Description | default(''))) | lower -%}
        {%-   if (bond_member_adapter_match | default('') | length == 0) or (bond_member_adapter_match | lower in aname) -%}
        {%-     for p in a.Ports | default([]) -%}
        {%-       set tech = ((p.LinkNetworkTechnology | default('')) ~ '|' ~ (p.PortProtocol | default(''))) | lower -%}
        {%-       if 'ethernet' in tech -%}
        {%-         set mac = '' -%}
        {%-         if p.Ethernet is defined and p.Ethernet.AssociatedMACAddresses is defined -%}
        {%-           set amac = p.Ethernet.AssociatedMACAddresses -%}
        {%-           if amac is string -%}
        {%-             set mac = amac -%}
        {%-           elif (amac | length) > 0 -%}
        {%-             set mac = amac[0] -%}
        {%-           endif -%}
        {%-         elif p.Ethernet is defined and p.Ethernet.MACAddress is defined -%}
        {%-           set mac = p.Ethernet.MACAddress -%}
        {%-         endif -%}
        {%-         if (mac | length) > 0 and (mac | lower not in ns.macs) -%}
        {%-           set ns.macs = ns.macs + [mac | lower] -%}
        {%-         endif -%}
        {%-       endif -%}
        {%-     endfor -%}
        {%-   endif -%}
        {%- endfor -%}
        {{ ns.macs[:(bond_member_count | int)] }}
    when: bond_member_selection | default('manual') == 'auto'
    delegate_to: localhost

  - name: Show the mgmt bond member MAC addresses selected for server '{{ serial_number }}'
    debug:
      msg: "Mgmt bond members (by MAC) for '{{ inventory_hostname }}': {{ bond_member_macs }}"
    when: bond_member_selection | default('manual') == 'auto'

  - name: Fail if no Ethernet MAC could be derived from the COM inventory (auto mode)
    fail:
      msg:
        - "Could not derive any mgmt bond member MAC address from the COM inventory for server '{{ serial_number }}'."
        - "Check 'bond_member_adapter_match' ('{{ bond_member_adapter_match }}') against the adapter names above,"
        - "or switch 'bond_member_selection' to 'mac' (with 'bond_member_macs') or 'manual' (with 'bond_interfaces')."
    when:
      - bond_member_selection | default('manual') == 'auto'
      - (bond_member_macs | default([]) | length) == 0

  # When a SEPARATE compute (VM) network is requested, derive the dedicated compute NIC MAC(s) too. If
  # 'hvm_compute_adapter_match' is set, the ports of THAT adapter are used; otherwise the ports that FOLLOW the
  # management ports on the same (management) adapter are used (offset by 'bond_member_count'). The seed then renames
  # them to 'comp0' (+ 'comp1'). This is a no-op in the default converged model (hvm_separate_compute_network=false).
  - name: Derive the dedicated compute NIC MAC addresses from the COM inventory (separate compute network)
    set_fact:
      compute_bond_member_macs: >-
        {%- set match = (hvm_compute_adapter_match | default('')) | trim -%}
        {%- set same = (match | length == 0) -%}
        {%- set effmatch = (bond_member_adapter_match if same else match) -%}
        {%- set ns = namespace(macs=[]) -%}
        {%- for a in server_inventory.json.networkAdapter.data | default([]) -%}
        {%-   set aname = ((a.Name | default('')) ~ ' ' ~ (a.Model | default('')) ~ ' ' ~ (a.Description | default(''))) | lower -%}
        {%-   if (effmatch | length == 0) or (effmatch | lower in aname) -%}
        {%-     for p in a.Ports | default([]) -%}
        {%-       set tech = ((p.LinkNetworkTechnology | default('')) ~ '|' ~ (p.PortProtocol | default(''))) | lower -%}
        {%-       if 'ethernet' in tech -%}
        {%-         set mac = '' -%}
        {%-         if p.Ethernet is defined and p.Ethernet.AssociatedMACAddresses is defined -%}
        {%-           set amac = p.Ethernet.AssociatedMACAddresses -%}
        {%-           if amac is string -%}
        {%-             set mac = amac -%}
        {%-           elif (amac | length) > 0 -%}
        {%-             set mac = amac[0] -%}
        {%-           endif -%}
        {%-         elif p.Ethernet is defined and p.Ethernet.MACAddress is defined -%}
        {%-           set mac = p.Ethernet.MACAddress -%}
        {%-         endif -%}
        {%-         if (mac | length) > 0 and (mac | lower not in ns.macs) -%}
        {%-           set ns.macs = ns.macs + [mac | lower] -%}
        {%-         endif -%}
        {%-       endif -%}
        {%-     endfor -%}
        {%-   endif -%}
        {%- endfor -%}
        {%- set start = (bond_member_count | int) if same else 0 -%}
        {{ ns.macs[start : start + (hvm_compute_nic_count | int)] }}
    when: bond_member_selection | default('manual') == 'auto' and (hvm_separate_compute_network | default(false) | bool)
    delegate_to: localhost

  - name: Show the dedicated compute NIC MAC addresses selected for server '{{ serial_number }}'
    debug:
      msg: "Compute NICs (by MAC) for '{{ inventory_hostname }}': {{ compute_bond_member_macs | default([]) }}"
    when: bond_member_selection | default('manual') == 'auto' and (hvm_separate_compute_network | default(false) | bool)

  - name: Fail if a separate compute network was requested but no compute NIC MAC could be derived
    fail:
      msg:
        - "'hvm_separate_compute_network' is true but no dedicated compute NIC MAC could be derived for '{{ serial_number }}'."
        - "Set 'hvm_compute_adapter_match' to the compute adapter name/model, or ensure the management adapter has at"
        - "least 'bond_member_count' + 'hvm_compute_nic_count' Ethernet ports, then re-run."
    when:
      - bond_member_selection | default('manual') == 'auto'
      - (hvm_separate_compute_network | default(false) | bool)
      - (compute_bond_member_macs | default([]) | length) == 0

  # ---- NS204i detection ----
  - name: Capture the presence of a NS204i NVMe boot controller in server '{{ serial_number }}'
    set_fact:
      NS204i_data: "{{ item }}"
    loop: "{{ server_inventory.json.storage.data }}"
    loop_control:
      label: never
    when: item.Name is search('NS204i')

  - debug:
      msg: "NS204i found in server '{{ serial_number }}'! NVMe RAID1 volume will be used as the OS boot volume."
    when: NS204i_data is defined

  - name: Capture size of the NS204i RAID1 volume if any
    set_fact:
      boot_drive_bytes_size: "{{ item.Volumes[0].CapacityBytes }}"
    loop: "{{ server_inventory.json.storage.data }}"
    loop_control:
      label: never
    when:
      - NS204i_data is defined
      - item.Name is defined
      - item.Name is search('NS204i')
      - item.Volumes is defined
      - item.Volumes | length > 0

  # ---- MR/SR controller detection ----
  - name: Capture storage RAID controller information when an HPE MR or SR controller is used with available drives
    set_fact:
      SR_MR_storage_controller_data: "{{ item }}"
    loop: "{{ server_inventory.json.storage.data }}"
    loop_control:
      label: never
    when:
      - NS204i_data is undefined
      - item.Drives is defined
      - item.Drives | length > 1
      - (item.Name is search('HPE MR') or item.Name is search('HPE SR'))
      - SR_MR_storage_controller_data is not defined

  - name: Set a variable for the name of the storage RAID controller found
    set_fact:
      storage_controller_name: "{{ SR_MR_storage_controller_data.Name }}"
    when: NS204i_data is undefined and SR_MR_storage_controller_data is defined

  - name: Capture size of the HPE MR or SR RAID1 volume if any
    set_fact:
      boot_drive_bytes_size: "{{ item.Volumes[0].CapacityBytes }}"
    loop: "{{ server_inventory.json.storage.data }}"
    loop_control:
      label: never
    when:
      - NS204i_data is undefined
      - SR_MR_storage_controller_data is defined
      - (item.Name is search('HPE MR') or item.Name is search('HPE SR'))
      - item.Volumes is defined
      - item.Volumes | length > 0

  # ---- Local disk fallback ----
  - name: Detect a local disk when no NS204i and no SR/MR controller with disks is available
    set_fact:
      no_NS204i_no_SR_MR_but_local_disk: "{{ item }}"
    loop: "{{ server_inventory.json.storage.data }}"
    loop_control:
      label: never
    when:
      - NS204i_data is undefined
      - SR_MR_storage_controller_data is undefined
      - item.Drives is defined
      - item.Drives | length > 0

  - name: Exit if no NS204i and no SR/MR controller with disk and no local disk found
    fail:
      msg: "Error! No storage controller with drives available found in the server. Ensure the server contains storage drives, then run the playbook again."
    when: NS204i_data is undefined and SR_MR_storage_controller_data is undefined and no_NS204i_no_SR_MR_but_local_disk is not defined

  - name: Set a variable for the name of the local disk controller when used
    set_fact:
      storage_controller_name: "{{ no_NS204i_no_SR_MR_but_local_disk.Name }}"
    when: NS204i_data is undefined and SR_MR_storage_controller_data is undefined and no_NS204i_no_SR_MR_but_local_disk is defined

  - name: Capture size of the local disk if any
    set_fact:
      boot_drive_bytes_size: "{{ item.Drives[0].CapacityBytes }}"
    loop: "{{ server_inventory.json.storage.data }}"
    loop_control:
      label: never
    when: NS204i_data is undefined and SR_MR_storage_controller_data is undefined and no_NS204i_no_SR_MR_but_local_disk is defined

  # ---- Controller type (kept for reference / autoinstall seed comment) ----
  - name: Set a controller type variable when a NS204i controller or local disk is present
    set_fact:
      Controller_type: "NS204i"
    when: NS204i_data is defined or no_NS204i_no_SR_MR_but_local_disk is defined

  - name: Set a controller type variable when there is no NS204i but an SR/MR controller is present
    set_fact:
      Controller_type: "{{ storage_controller_name }}"
    when: SR_MR_storage_controller_data is defined

  - debug:
      msg: "OS boot volume detected on controller '{{ Controller_type }}' with size {{ ((boot_drive_bytes_size | int) / (1024 ** 3)) | round(1) }} GB"


#--------------------------------------Create internal storage settings (SR/MR only) ----------------------------------

  - name: Check if settings '{{ raid_type }}' already exist
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ server_settings_API_version }}/settings?filter={{ filter | urlencode }}"
      method: GET
      headers:
        Authorization: "Bearer {{ access_token }}"
    vars:
      filter: "name eq '{{ raid_type }}'"
    register: internal_storage_server_setting
    when: SR_MR_storage_controller_data is defined
    delegate_to: localhost

  - name: Create internal storage configuration '{{ raid_type }}' ({{ volume_size_in_GB }} GB) for the OS boot volume when it does not exist
    uri:
      url: "{{ ConnectivityEndpoint }}/compute-ops-mgmt/{{ server_settings_API_version }}/settings"
      method: POST
      status_code: 201
      headers:
        Authorization: "Bearer {{ access_token }}"
        Content-Type: "application/json"
      body_format: json
      body:
        name: "{{ raid_type }}"
        description: "Local storage settings using {{ raid_type }} for OS"
        platformFamily: "Any"
        category: "STORAGE"
        settings:
          DEFAULT:
            raidType: "{{ raid_type }}"
            volumeSizeInGB: "{{ volume_size_in_GB }}"
    register: internal_storage_server_setting_result
    when: SR_MR_storage_controller_data is defined and internal_storage_server_setting.json.count == 0
    delegate_to: localhost

  - name: Set the resourceUri of the internal storage configuration '{{ raid_type }}' just created
    set_fact:
      internal_storage_server_setting_resourceuri: "{{ internal_storage_server_setting_result.json.resourceUri }}"
    when: SR_MR_storage_controller_data is defined and internal_storage_server_setting.json.count == 0

  - name: Set the resourceUri of the internal storage configuration '{{ raid_type }}' when it already exists
    set_fact:
      internal_storage_server_setting_resourceuri: "{{ internal_storage_server_setting | json_query('json.items[0].resourceUri') }}"
    when: SR_MR_storage_controller_data is defined and internal_storage_server_setting.json.count == 1


#--------------------------------------Create temporary server group with server settings -----------------------------

  - name: Create server group name '{{ inventory_hostname }}_server_group' variable
    set_fact:
